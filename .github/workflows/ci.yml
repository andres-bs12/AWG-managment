# Checks every push and PR; the full browser suite runs on release branches and on demand,
# so long E2E runs happen on GitHub instead of the developer's Mac.
name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

# Pinned runner: ubuntu-latest moved to 26.04, whose libraries Playwright's installer does not know yet.
jobs:
  backend:
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: awg-tracking } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21', cache: maven }
      - run: ./mvnw -q -B test

  frontend:
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npx tsc -b
      - run: npm run lint
      - run: node --test tests/*.test.mjs
      - run: VITE_DATA_SOURCE=http npm run build

  e2e-quick:
    # Every push to a release branch or main: all flows on desktop, one public phone and one
    # staff phone (~270 tests, ~10 min). Catches almost every break while a version is in progress.
    if: github.event_name == 'push' && (startsWith(github.ref, 'refs/heads/release/') || github.ref == 'refs/heads/main')
    needs: frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      # Visual baselines are macOS captures reviewed by eye; Linux rendering differs, so CI checks
      # behaviour and accessibility and leaves pixel comparison to the local review.
      - run: npx playwright test --ignore-snapshots --reporter=line,html --project=desktop --project=mobile --project=phone-360x640 --project=staff-phone-360x640
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report-quick, path: frontend/playwright-report, retention-days: 7 }

  e2e-full:
    # The whole suite (every viewport, locale, browser): once per version, before deploying.
    # Start it from GitHub -> Actions -> CI -> Run workflow (or `gh workflow run CI --ref <branch>`).
    # Split over 4 machines so it takes ~12 min instead of ~35.
    if: github.event_name == 'workflow_dispatch'
    needs: frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: { shard: [1, 2, 3, 4] }
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npx playwright test --ignore-snapshots --reporter=line,html --shard=${{ matrix.shard }}/4
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-shard-${{ matrix.shard }}
          path: frontend/playwright-report
          retention-days: 7
