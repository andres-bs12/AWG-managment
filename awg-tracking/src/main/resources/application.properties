spring.application.name=awg-tracking

# Database (PostgreSQL). Override with environment variables in every non-local environment.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/awg_tracking}
spring.datasource.username=${DB_USERNAME:${USER:postgres}}
spring.datasource.password=${DB_PASSWORD:}
# Schema is owned by Flyway (src/main/resources/db/migration); Hibernate only checks it matches.
# baseline-on-migrate lets an existing database created by the old ddl-auto=update start at V1.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:validate}
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.jpa.open-in-view=false
# Missing booleans (e.g. withName on a finished ornament) default to false instead of failing.
spring.jackson.deserialization.fail-on-null-for-primitives=false
# Loads lazy collections (item photos) in batches instead of one query per item.
spring.jpa.properties.hibernate.default_batch_fetch_size=100
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Uploads: up to 6 photos per ornament, 10 MB each.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=60MB

server.error.include-message=never
server.error.include-stacktrace=never
# Trust X-Forwarded-* only behind a reverse proxy you control.
server.forward-headers-strategy=${FORWARD_HEADERS:none}

awg.zone=Europe/Vienna
awg.pricing.custom=49.99
awg.pricing.finished=39.99
awg.pricing.name-extra=12.99
awg.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:5174}
awg.uploads.dir=${UPLOADS_DIR:./data/uploads}
awg.uploads.max-bytes=10485760
awg.session.ttl=PT12H
awg.calendar.home-days-ahead=60
# Gaby paints every day unless she closes it; automatic planning books at most this many per day.
awg.calendar.default-max-paintings=${DEFAULT_MAX_PAINTINGS:2}
awg.bootstrap.initial-custom-stock=${INITIAL_CUSTOM_STOCK:3}
awg.bootstrap.initial-finished-stock=${INITIAL_FINISHED_STOCK:10}
awg.bootstrap.demo-markets=${DEMO_MARKETS:false}
# Staff accounts are created on start-up only when their password is provided.
awg.bootstrap.staff[0].name=Gaby
awg.bootstrap.staff[0].email=gaby@artwithgab.com
awg.bootstrap.staff[0].password=${STAFF_GABY_PASSWORD:}
awg.bootstrap.staff[1].name=Andres
awg.bootstrap.staff[1].email=andres@artwithgab.com
awg.bootstrap.staff[1].password=${STAFF_ANDRES_PASSWORD:}

# Web shop (Vienna delivery, Stripe Checkout). Disabled until the owner sets the Stripe keys.
awg.shop.enabled=${SHOP_ENABLED:false}
awg.shop.public-base-url=${PUBLIC_BASE_URL:http://localhost:5173}
awg.shop.stripe-secret-key=${STRIPE_SECRET_KEY:}
awg.shop.stripe-webhook-secret=${STRIPE_WEBHOOK_SECRET:}
awg.shop.delivery-fee=${SHOP_DELIVERY_FEE:0.00}
awg.shop.lead-days=1
awg.shop.max-days-ahead=60
# Last delivery day of the season (24 Dec is a Thursday in 2026); the shop closes after it.
awg.shop.season-end=${SHOP_SEASON_END:2026-12-24}
# Unpaid checkouts hold painting time and stock for ~40 min; at most this many at once.
awg.shop.max-open-checkouts=${SHOP_MAX_OPEN_CHECKOUTS:15}
# No web deliveries before this day: the season starts with the first market weekend (27-29 Nov 2026).
awg.shop.deliveries-from=${SHOP_DELIVERIES_FROM:2026-11-30}

# Data retention (GDPR storage limitation), counted from the handover. Accounting data (code, date,
# amounts, items) is kept; name, contact data, address, pet details and photos are deleted.
awg.retention.form-link-days=${RETENTION_FORM_LINK_DAYS:30}
awg.retention.personal-data-days=${RETENTION_PERSONAL_DATA_DAYS:60}
awg.retention.stale-order-days=${RETENTION_STALE_ORDER_DAYS:365}
awg.retention.waitlist-unconfirmed-days=${RETENTION_WAITLIST_UNCONFIRMED_DAYS:7}

# E-mail notifications to the owner and the customer. Nothing is sent until MAIL_HOST is set.
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.checkserveridentity=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=10000
awg.mail.from=${MAIL_FROM:}
awg.mail.owner-email=${OWNER_EMAIL:}
