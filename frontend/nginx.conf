# Keep tokenised customer-form links out of the access log (they grant access to an order).
map $request_uri $loggable {
    ~^/form/        0;
    ~^/api/forms/   0;
    default         1;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 60m;
    server_tokens off;
    access_log /var/log/nginx/access.log combined if=$loggable;

    # Production runs Cloudflare -> Caddy on the host -> this container, so every request arrives
    # from the Docker bridge. Take the visitor address from CF-Connecting-IP (set by Cloudflare) so
    # rate limits see real clients. Only safe because the server firewall admits Cloudflare ranges
    # alone; without Cloudflare the header is absent and $remote_addr stays unchanged.
    set_real_ip_from 172.16.0.0/12;
    real_ip_header CF-Connecting-IP;

    # Security headers (fonts are self-hosted, so no third-party origins are needed).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self' https://checkout.stripe.com; object-src 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Overwrite (never append) so a client cannot spoof its address for the rate limits.
        # $remote_addr is already the visitor address (see set_real_ip_from above).
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Hashed build assets never change.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Frame-Options "DENY" always;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self' https://checkout.stripe.com; object-src 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Frame-Options "DENY" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        try_files $uri $uri/ /index.html;
    }
}
